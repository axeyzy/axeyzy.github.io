<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical Commander // Operational Core v4.3</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: 'JetBrains Mono', monospace; background: #02050a; color: #7a92a8; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        body::before { content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 255, 0, 0.06)); z-index: 99999; background-size: 100% 4px, 6px 100%; pointer-events: none; opacity: 0.4; }
        .password-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #02050a; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .password-screen.hidden { display: none !important; }
        .password-box { background: #040914; border: 2px solid #00f2fe; padding: 40px; width: 400px; box-shadow: 0 0 30px rgba(0, 242, 254, 0.15); position: relative; }
        .password-title { font-size: 14px; font-weight: 700; color: #00f2fe; letter-spacing: 0.25em; margin-bottom: 6px; }
        .password-input { background: #010307; border: 1px solid #1e354d; color: #00f2fe; padding: 14px; font-family: inherit; font-size: 16px; width: 100%; outline: none; text-align: center; letter-spacing: 0.5em; margin-bottom: 16px; }
        .password-button { background: rgba(0, 242, 254, 0.08); color: #00f2fe; border: 1px solid #00f2fe; padding: 12px; font-family: inherit; font-size: 11px; font-weight: 700; width: 100%; cursor: pointer; letter-spacing: 0.15em; }
        .header { background: #040914; border-bottom: 2px solid #122236; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; height: 54px; z-index: 10; position: relative; }
        .op-title { display: flex; align-items: center; gap: 12px; }
        .op-indicator { width: 8px; height: 8px; background: #00f2fe; box-shadow: 0 0 10px #00f2fe; animation: blink 2s infinite ease-in-out; }
        .op-name { font-size: 13px; font-weight: 700; letter-spacing: 0.15em; color: #d1dfec; }
        .controls { display: flex; gap: 16px; align-items: center; }
        .control-group { display: flex; gap: 6px; align-items: center; border-right: 1px solid #122236; padding-right: 16px; }
        .main { flex: 1; display: flex; overflow: hidden; position: relative; }
        .sidebar { width: 260px; background: #040914; display: flex; flex-direction: column; z-index: 5; position: relative; }
        .sidebar-left { border-right: 2px solid #122236; }
        .sidebar-right { border-left: 2px solid #122236; }
        .sidebar-content { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 18px; }
        .section { display: flex; flex-direction: column; gap: 8px; background: rgba(1, 3, 7, 0.4); border: 1px solid #122236; padding: 10px; position: relative; }
        .section-title { font-size: 9px; letter-spacing: 0.15em; color: #43586d; font-weight: 700; border-bottom: 1px solid #122236; padding-bottom: 4px; margin-bottom: 2px; }
        .button-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .button-grid.triple { grid-template-columns: repeat(3, 1fr); }
        button { background: #010307; border: 1px solid #1e354d; color: #7a92a8; padding: 8px; font-family: inherit; font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; text-align: left; padding-left: 12px; }
        button:hover:not(:disabled) { border-color: #43586d; color: #d1dfec; }
        button.active { border-color: #00f2fe; color: #00f2fe; }
        .canvas-container { flex: 1; background: #010306; position: relative; }
        canvas { display: block; width: 100%; height: 100%; }
        .log-terminal { height: 120px; background: #010307; border-top: 2px solid #122236; padding: 12px; font-size: 10px; color: #00f2fe; overflow-y: auto; }
        .log-line { margin-bottom: 4px; display: flex; gap: 12px; }
        textarea { background: #010307; border: 1px solid #1e354d; color: #d1dfec; padding: 10px; font-family: inherit; font-size: 10px; resize: none; flex: 1; }
        .stat { display: flex; justify-content: space-between; font-size: 10px; padding: 4px 0; border-bottom: 1px dashed rgba(18,34,54,0.5); }
        .stat-val { color: #00f2fe; font-weight: 700; }
        .unit-info-box { background: #010307; border: 1px solid #1e354d; padding: 12px; font-size: 10px; line-height: 1.6; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2,5,10,0.85); z-index: 5000; display: none; }
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #040914; border: 2px solid #ff3366; padding: 24px; width: 340px; z-index: 5001; display: none; }
        .modal.active, .modal-overlay.active { display: block; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body>
    <div class="password-screen" id="auth-screen">
        <div class="password-box">
            <div class="password-title">TACTICAL COMMAND SURFACE</div>
            <input type="password" class="password-input" id="auth-input" placeholder="••••"/>
            <button class="password-button" id="auth-submit">DECRYPT & RUN</button>
        </div>
    </div>
    <div class="header">
        <div class="op-title"><div class="op-indicator"></div><span class="op-name" id="op-label">SYS.MAIN // RECON_V4.3</span></div>
        <div class="controls">
            <button id="ctrl-play">EXECUTE SIM</button>
            <button id="ctrl-reset">RESET</button>
        </div>
    </div>
    <div class="main">
        <div class="sidebar sidebar-left">
            <div class="sidebar-content">
                <div class="section">
                    <div class="section-title">COMMAND SELECTION</div>
                    <div class="button-grid">
                        <button class="mode-btn active" data-mode="deploy">DEPLOY UNITS</button>
                        <button class="mode-btn" data-mode="path">ROUTING ZONES</button>
                    </div>
                </div>
                <div class="section">
                    <div class="section-title">FACTION</div>
                    <div class="button-grid">
                        <button class="faction-btn active" data-faction="GAR">GAR</button>
                        <button class="faction-btn" data-faction="OPFOR" style="color:#ff3366;">OPFOR</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="canvas-container" id="canvas-holder"><canvas id="tactical-grid"></canvas></div>
        <div class="sidebar sidebar-right">
            <div class="sidebar-content">
                <div class="section"><div class="section-title">INFO</div><div class="unit-info-box" id="info-display">AWAITING TARGET</div></div>
            </div>
        </div>
    </div>
    <div class="log-terminal" id="system-log"></div>
    <script>
        const COLORS = { GAR: '#00f2fe', OPFOR: '#ff3366' };
        const STATE = {
            mode: 'deploy', faction: 'GAR', animating: false, animProgress: 0,
            phases: [{ assets: [], paths: [] }]
        };

        const canvas = document.getElementById('tactical-grid');
        const ctx = canvas.getContext('2d');

        function bootstrapSystem() {
            window.addEventListener('resize', resize);
            resize();
            attachListeners();
            requestAnimationFrame(render);
        }

        function resize() { canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight; }

        function attachListeners() {
            canvas.addEventListener('mousedown', e => {
                if(STATE.animating) return;
                const pt = { x: e.offsetX, y: e.offsetY };
                if(STATE.mode === 'deploy') {
                    STATE.phases[0].assets.push({ id: Math.random(), x: pt.x, y: pt.y, origX: pt.x, origY: pt.y, faction: STATE.faction, type: 'Infantry' });
                }
            });
            document.getElementById('ctrl-play').addEventListener('click', () => {
                STATE.animating = true;
                STATE.animProgress = 0;
            });
            document.getElementById('ctrl-reset').addEventListener('click', () => {
                STATE.animating = false;
                STATE.animProgress = 0;
                // Hard reset coordinates to original anchor points
                STATE.phases[0].assets.forEach(a => { a.x = a.origX; a.y = a.origY; });
            });
        }

        function render() {
            ctx.fillStyle = "#010306";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if(STATE.animating) {
                STATE.animProgress += 0.005;
                if(STATE.animProgress >= 1) STATE.animating = false;
            }

            STATE.phases[0].assets.forEach(a => {
                // If animating, calculate movement offset from original position, 
                // but keep original position (origX/origY) untouched
                let displayX = a.origX;
                let displayY = a.origY;
                
                if(STATE.animating) {
                    // Logic: animate toward a target point (or path)
                    displayX = a.origX + (Math.sin(STATE.animProgress * 5) * 50); 
                }
                
                ctx.fillStyle = COLORS[a.faction];
                ctx.beginPath(); ctx.arc(displayX, displayY, 10, 0, Math.PI*2); ctx.fill();
            });

            requestAnimationFrame(render);
        }

        document.getElementById('auth-submit').addEventListener('click', () => {
            document.getElementById('auth-screen').classList.add('hidden');
            bootstrapSystem();
        });
    </script>
</body>
</html>
